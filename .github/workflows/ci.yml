name: Vérification du projet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Régénérer le lockfile avec les correctifs imposés
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier les vulnérabilités npm
        run: npm audit --audit-level=moderate

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Vérifier ESLint
        run: npm run lint

      - name: Construire en production
        run: npm run build

      - name: Enregistrer les versions corrigées
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain package.json package-lock.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Corriger PostCSS et verrouiller les dépendances"
            git push
          else
            echo "Les fichiers de dépendances sont déjà à jour."
          fi
