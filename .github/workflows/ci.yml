name: Vérification du projet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Mettre Next.js à jour vers le correctif maintenu
        run: npm install --save-exact next@15.5.29

      - name: Corriger les dépendances vulnérables sans changement majeur
        run: npm audit fix || true

      - name: Résumé des alertes npm restantes
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const entries = Object.entries(audit.vulnerabilities || {});
          if (!entries.length) {
            console.log('Aucune vulnérabilité npm détectée.');
          } else {
            for (const [name, item] of entries) {
              console.log(`${item.severity}: ${name} — ${item.range}`);
            }
          }
          NODE

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Vérifier ESLint
        run: npm run lint

      - name: Construire en production
        run: npm run build

      - name: Enregistrer les versions corrigées
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain package.json package-lock.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Mettre à jour les dépendances et correctifs de sécurité"
            git push
          else
            echo "Les fichiers de dépendances sont déjà à jour."
          fi
