<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Visibilité réduite par le brouillard</title><desc id="d">Séquence animée pédagogique : le brouillard s’épaissit et réduit progressivement la visibilité de la chaussée.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dcebf2"/><stop offset="1" stop-color="#f7fafb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#15202b" flood-opacity=".22"/></filter></defs><rect width="1000" height="560" rx="28" fill="url(#sky)"/><g font-family="Arial,Helvetica,sans-serif">
